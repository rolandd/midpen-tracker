# pnpm 11 keeps settings (including overrides) here rather than in package.json.
#
# The `cookie@<0.7.0 -> ^0.7.0` override existed only because SvelteKit 2 pinned
# cookie@^0.6.0 (GHSA-pxg6-pf52-xh8x). SvelteKit 3 requires cookie@^2 and uses
# its ESM-only named exports, so the override is gone.

# pnpm 11 refuses to run dependency install scripts unless allow-listed, and
# exits non-zero while one is pending. esbuild ships its platform binary as an
# optional dependency, so its install script is not needed.
allowBuilds:
  esbuild: false
