[package]
name = "midpen-tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-lc-rs = "1"
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
axum-extra = { version = "0.12.5", features = ["cookie"] }

# Auth & JWT
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }

# Geo processing
geo = "0.33"
geojson = "1.0"
polyline = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for Strava API)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Tracing/Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Base64 encoding
base64 = "0.23"

# URL encoding
urlencoding = "2"

# Config
dotenvy = "0.15"

# Date/time handling
# jiff is the date/time library used by the Firestore client, so we use it
# throughout instead of keeping a second implementation (chrono) around.
jiff = { version = "0.2", features = ["serde"] }
# `time` is required by the cookie handling in axum-extra.
time = "0.3"

# GCP SDK
# `tls-webpki-roots` gives the gRPC client rustls with bundled Mozilla roots,
# so no OpenSSL or host certificate store is needed (distroless runtime).
firestore = { version = "0.61", default-features = false, features = ["tls-webpki-roots"] }
google-cloud-tasks-v2 = { version = "1", default-features = false }
futures-util = "0.3.31"

# Concurrent data structures
dashmap = "6"

# Validation
validator = { version = "0.21", features = ["derive"] }

# TypeScript bindings generation
ts-rs = { version = "12.0", features = ["serde-compat"], optional = true }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
hkdf = "0.13.0"
subtle = "2"
google-cloud-gax = "1"
google-cloud-kms-v1 = "1"

[features]
binding-generation = ["ts-rs"]

[dev-dependencies]
criterion = "0.8.1"
proptest = "1.12.0"

[[bench]]
name = "preserve_benchmark"
harness = false
